
services:
  # -------------------------------------------------------
  # Main FastAPI Application Service
  # -------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Docker/Dockerfile
    container_name: ai_video_extractor_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      # Persist media files (your intro/outro branding) so they survive restarts
      - ./media:/app/media:ro
      # Persist logo
      - ./logo:/app/logo:ro
      # Persist config files
      - ./config:/app/config:ro
      # Named volumes for data dirs (processed files are temporary but good to persist across restarts)
      - video_input:/app/data/input
      - video_output:/app/data/output
      - video_temp:/app/data/temp
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s    # Give Whisper model time to pre-load on startup

  # -------------------------------------------------------
  # AI Video Processing Worker
  # -------------------------------------------------------
  ai_worker:
    build:
      context: .
      dockerfile: Docker/Dockerfile
    container_name: ai_video_worker
    restart: unless-stopped
    command: python -u src/worker.py
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./media:/app/media:ro
      - ./logo:/app/logo:ro
      - ./config:/app/config:ro
      - video_input:/app/data/input
      - video_output:/app/data/output
      - video_temp:/app/data/temp
      - app_logs:/app/logs

# -------------------------------------------------------
# Named Volumes (persists data between container restarts)
# -------------------------------------------------------
volumes:
  video_input:
  video_output:
  video_temp:
  app_logs:
