name: Python CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install System Dependencies (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff # For linting

    - name: Lint Code with Ruff
      run: |
        # Stop the build if there are severe Python syntax errors or undefined names
        ruff check . --select=E9,F63,F7,F82 --output-format=github
        # Default linting for warnings (won't fail the build)
        ruff check . --exit-zero
        
    - name: Check Python Syntax (Dry Run)
      run: |
        # Verify that the main scripts compile correctly without syntax errors
        python -m py_compile main.py app.py
