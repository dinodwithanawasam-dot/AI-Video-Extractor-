# LLM Configuration (OpenAI)
llm:
  model_name: "gpt-4o-mini" # Fast and capable OpenAI model
  temperature: 0.7
  max_tokens: 2000

# Audio Transcription (Whisper AI)
whisper:
  model_size: "base" # Options: tiny, base, small, medium, large, large-v3
  device: "cpu"      # Change to "cuda" if you have an Nvidia GPU
  language: "en"     # Omit or set to null for auto-detect

# Video Processing & Reels extraction
video:
  download_resolution: "720p"
  audio_extract_format: "mp3"
  num_reels: 3
  target_reel_duration_seconds: 30
  
# Output directories
paths:
  input_dir: "data/input"
  output_dir: "data/output"
  temp_dir: "data/temp"
